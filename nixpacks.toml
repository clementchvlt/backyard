[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_22", "nginx"]

[phases.build]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-interaction",
  "php artisan octane:install --server=frankenphp --no-interaction",
  "rm -rf node_modules",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan optimize && php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=$PORT"
