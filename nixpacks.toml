[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_22", "nginx"]

[phases.build]
cmds = [
  "composer install --optimize-autoloader --no-dev --no-interaction",
  "rm -rf node_modules",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php-fpm --nodaemonize --fpm-config /app/php-fpm.conf & nginx -c /app/nginx.conf -g 'daemon off;'"
